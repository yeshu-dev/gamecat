/* Layout: sticky bar, split hero, then a searchable card grid of categories and an about band. Hash routes: #categories and #about scroll the home view; #<category-id> swaps in that category's game list. Dark single look with violet and cyan accents. */
:root {
  --bg: #090b14;
  --panel: #121625;
  --panel2: #191f32;
  --text: #f4f6ff;
  --muted: #a6aec5;
  --accent: #8b5cf6;
  --accent-soft: #c4b5fd;
  --cyan: #22d3ee;
  --line: rgba(255, 255, 255, .09);
  --bar: rgba(9, 11, 20, .86);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  background:
    radial-gradient(ellipse at 80% 0%, rgba(91, 33, 182, .24), transparent 35%),
    radial-gradient(ellipse at 5% 25%, rgba(8, 145, 178, .13), transparent 30%),
    var(--bg);
  background-color: var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
[id] { scroll-margin-top: calc(76px + env(safe-area-inset-top, 0px)); }

.band { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1200px; margin: 0 auto; }

header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  padding-top: 17px; padding-bottom: 17px;
  padding-left: max(clamp(20px, 6vw, 88px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(20px, 6vw, 88px), env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--bar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 900; letter-spacing: .5px; font-size: 1.25rem; }
.brand span { color: var(--cyan); }
nav.main { display: flex; gap: 26px; }
nav.main a { color: var(--muted); font-size: .92rem; transition: color .2s ease; }
nav.main a:hover { color: #fff; }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

.hero { padding-top: 88px; padding-bottom: 62px; }
.hero .inner { display: grid; grid-template-columns: 1.2fr .8fr; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(2.6rem, 6vw, 5.4rem); line-height: .98; margin: 16px 0 22px; letter-spacing: -3px; font-weight: 800; }
.hero h1 span { color: transparent; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; }
.hero p { color: var(--muted); max-width: 590px; line-height: 1.75; font-size: 1.05rem; margin: 0; }
.hero-actions { display: flex; gap: 13px; margin-top: 30px; flex-wrap: wrap; }
.btn { display: inline-block; border-radius: 10px; padding: 13px 19px; font-weight: 700; font-size: .92rem; transition: transform .25s var(--ease), box-shadow .25s ease, background .25s ease; }
.btn:hover { transform: translateY(-2px); }
.primary { color: #090b14; background: linear-gradient(100deg, #a78bfa, #67e8f9); }
.primary:hover { box-shadow: 0 10px 26px -10px #67e8f9; }
.secondary { color: var(--text); border: 1px solid var(--line); background: rgba(255, 255, 255, .04); }
.secondary:hover { background: rgba(255, 255, 255, .08); }
.hero-art {
  min-height: 310px; border: 1px solid var(--line); border-radius: 28px;
  background: linear-gradient(145deg, rgba(139, 92, 246, .23), rgba(34, 211, 238, .08)), var(--panel);
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.hero-art::before, .hero-art::after { content: ""; position: absolute; border: 1px solid rgba(255, 255, 255, .12); border-radius: 50%; width: 280px; height: 280px; }
.hero-art::after { width: 390px; height: 390px; }
.controller { font-size: clamp(6rem, 12vw, 9rem); filter: drop-shadow(0 15px 30px rgba(34, 211, 238, .25)); z-index: 1; animation: bob 5s ease-in-out infinite; }
.floating { position: absolute; z-index: 2; background: #202940; border: 1px solid var(--line); padding: 10px 13px; border-radius: 12px; font-size: .85rem; box-shadow: 0 12px 35px rgba(0, 0, 0, .33); }
.float-one { top: 18%; left: 8%; }
.float-two { right: 7%; bottom: 18%; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

main.band { padding-bottom: 80px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin: 15px 0 25px; }
.section-head h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); margin: 8px 0; letter-spacing: -1px; font-weight: 800; }
.section-head p { color: var(--muted); margin: 0; }
.search { width: min(100%, 270px); padding: 12px 14px; color: #fff; font: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; outline: none; transition: border-color .2s ease; }
.search:focus { border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 24px; }
.filter, .chip {
  border: 1px solid var(--line); background: rgba(255, 255, 255, .035); color: var(--muted);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: .85rem;
  transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease;
}
.filter:hover, .chip:hover { color: #fff; border-color: var(--accent); background: rgba(139, 92, 246, .18); transform: translateY(-1px); }
.filter.active, .chip[aria-current="page"] { color: #fff; border-color: var(--accent); background: rgba(139, 92, 246, .28); }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
.card {
  display: flex; flex-direction: column; min-height: 205px; padding: 21px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .045), transparent 65%), var(--panel);
  border: 1px solid var(--line); border-radius: 17px;
  transition: transform .25s var(--ease), border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
  animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms);
}
.card:hover { transform: translateY(-5px); border-color: rgba(139, 92, 246, .65); background-color: var(--panel2); box-shadow: 0 16px 34px -18px var(--accent); }
.card:active { transform: translateY(-2px) scale(.99); }
.card-top { display: flex; justify-content: space-between; align-items: center; }
.emoji { font-size: 2rem; line-height: 1; }
.tag { font-size: .7rem; color: var(--cyan); background: rgba(34, 211, 238, .1); padding: 5px 8px; border-radius: 999px; letter-spacing: .04em; }
.card h3 { margin: 17px 0 8px; font-size: 1.16rem; font-weight: 700; }
.card p { color: var(--muted); line-height: 1.55; font-size: .91rem; margin: 0 0 13px; }
.examples { color: var(--accent-soft); font-size: .8rem; }
.visit { margin-top: auto; padding-top: 14px; font-size: .85rem; font-weight: 700; color: var(--cyan); }
.visit i { font-style: normal; display: inline-block; transition: transform .25s var(--ease); }
.card:hover .visit i { transform: translateX(5px); }
.empty { color: var(--muted); padding: 35px; text-align: center; border: 1px dashed var(--line); border-radius: 15px; }

.about { margin-top: 70px; padding: 30px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(110deg, rgba(139, 92, 246, .12), rgba(34, 211, 238, .06)); display: flex; justify-content: space-between; gap: 25px; align-items: center; }
.about h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); margin: 8px 0; letter-spacing: -1px; font-weight: 800; }
.about p { color: var(--muted); line-height: 1.7; max-width: 700px; margin: 0; }

/* category view */
.crumb { color: var(--muted); font-size: .9rem; padding: 36px 0 18px; }
.crumb a { text-decoration: underline; text-underline-offset: 3px; }
.crumb a:hover { color: #fff; }
.ghero {
  display: flex; align-items: center; gap: 26px; padding: 30px; margin-bottom: 20px;
  border: 1px solid var(--line); border-radius: 24px;
  background: linear-gradient(145deg, rgba(139, 92, 246, .23), rgba(34, 211, 238, .08)), var(--panel);
  animation: rise .5s var(--ease) backwards;
}
.ghero .big { font-size: clamp(3.4rem, 9vw, 5.4rem); line-height: 1; filter: drop-shadow(0 12px 26px rgba(34, 211, 238, .25)); }
.ghero h1 { font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -2px; line-height: 1.02; font-weight: 800; margin: 10px 0 8px; }
.ghero p { color: var(--muted); margin: 0; max-width: 58ch; line-height: 1.65; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; animation: rise .5s var(--ease) 80ms backwards; }
.games { display: flex; flex-direction: column; gap: 12px; }
.game {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 22px; align-items: center; padding: 20px 22px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .045), transparent 65%), var(--panel);
  border: 1px solid var(--line); border-radius: 17px;
  transition: transform .25s var(--ease), border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
  animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 60ms + 140ms);
}
.game:hover { transform: translateY(-3px); border-color: rgba(139, 92, 246, .65); background-color: var(--panel2); box-shadow: 0 16px 34px -18px var(--accent); }
.game h3 { font-size: 1.3rem; font-weight: 700; }
.game .meta { color: var(--cyan); font-size: .8rem; font-weight: 600; margin-top: 3px; }
.game p { margin: 6px 0 0; color: var(--muted); font-size: .93rem; line-height: 1.55; max-width: 64ch; }
.note { color: var(--muted); font-size: .85rem; margin-top: 22px; max-width: 70ch; }

footer { border-top: 1px solid var(--line); color: var(--muted); text-align: center; padding-top: 24px; padding-bottom: 24px; font-size: .85rem; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero .inner > div:first-child, .hero-art { animation: rise .55s var(--ease) backwards; }
.hero-art { animation-delay: 100ms; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .28s; animation-timing-function: ease; }

@media (max-width: 800px) {
  .hero { padding-top: 60px; }
  .hero .inner { grid-template-columns: 1fr; }
  .hero-art { min-height: 240px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  nav.main { gap: 14px; }
  nav.main a { font-size: .8rem; }
  .hero { padding-top: 48px; padding-bottom: 45px; }
  .hero h1 { letter-spacing: -2px; }
  .section-head { align-items: stretch; flex-direction: column; }
  .search { width: 100%; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .about { flex-direction: column; align-items: flex-start; }
  .ghero { flex-direction: column; align-items: flex-start; padding: 22px; gap: 14px; }
  .game { grid-template-columns: minmax(0, 1fr); }
  .game .btn { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

    blurb: "Team up with other players, control unique characters, and work together to win objectives.",
    games: [
      ["League of Legends", "Riot Games, 2009", "Five-on-five lane battles with a huge roster of champions.", "https://www.leagueoflegends.com/"],
      ["Dota 2", "Valve, 2013", "A deep team strategy game with a yearly world championship.", "https://www.dota2.com/"],
      ["Heroes of the Storm", "Blizzard Entertainment, 2015", "Team brawls across maps with shared experience and objectives.", "https://heroesofthestorm.blizzard.com/"],
      ["Pokémon UNITE", "TiMi Studio Group, 2021", "Five-on-five matches with Pokémon scoring points in enemy goals.", "https://unite.pokemon.com/"],
      ["Mobile Legends: Bang Bang", "Moonton, 2016", "A mobile-first MOBA with short matches.", "https://m.mobilelegends.com/"]
    ] }
];

var view = document.getElementById("view");
var state = { q: "", f: "All" };
var current = null;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function examples(g) { return g.games.slice(0, 2).map(function (m) { return m[0]; }).join(", "); }
function haystack(g) {
  return (g.name + " " + g.blurb + " " + g.group + " " + g.games.map(function (m) { return m[0]; }).join(" ")).toLowerCase();
}

function renderHome() {
  document.title = "GameVerse";
  var cards = GENRES.map(function (g, i) {
    return '<a class="card" href="#' + g.id + '" data-group="' + g.group + '" data-hay="' + esc(haystack(g)) + '" style="--i:' + i + '">' +
      '<div class="card-top"><span class="emoji" aria-hidden="true">' + g.emoji + '</span><span class="tag">' + esc(g.group.toUpperCase()) + "</span></div>" +
      "<h3>" + esc(g.name) + "</h3><p>" + esc(g.blurb) + "</p>" +
      '<div class="examples">Examples: ' + esc(examples(g)) + "</div>" +
      '<span class="visit">View ' + g.games.length + ' games <i>→</i></span></a>';
  }).join("");
  var filters = FILTERS.map(function (f) {
    return '<button class="filter' + (f === state.f ? " active" : "") + '" type="button" data-filter="' + f + '">' + (f === "All" ? "All games" : f) + "</button>";
  }).join("");

  view.innerHTML =
    '<section class="hero band"><div class="inner">' +
      '<div><div class="eyebrow">Find your next favorite game</div>' +
      "<h1>Every game has<br><span>its own world.</span></h1>" +
      "<p>Pick a category, browse a list of well-known games in it, and jump straight to each game's official site.</p>" +
      '<div class="hero-actions"><a class="btn primary" href="#categories">Explore categories</a><a class="btn secondary" href="#about">Learn about genres</a></div></div>' +
      '<div class="hero-art" role="img" aria-label="Decorative game controller illustration"><div class="floating float-one">🎯 Competitive play</div><div class="controller">🎮</div><div class="floating float-two">✨ Endless adventures</div></div>' +
    "</div></section>" +
    '<main class="band"><div class="inner">' +
      '<section id="categories"><div class="section-head"><div><div class="eyebrow">Browse the collection</div><h2>Gaming categories</h2><p>Choose a genre or search for a category or game.</p></div>' +
      '<input class="search" id="search" type="search" placeholder="Search categories or games..." aria-label="Search categories or games" value="' + esc(state.q) + '"></div>' +
      '<div class="filters" id="filters" aria-label="Category filters">' + filters + "</div>" +
      '<div class="grid" id="grid">' + cards + "</div>" +
      '<div class="empty" id="empty" hidden>No categories found. Try another search.</div></section>' +
      '<section class="about" id="about"><div><div class="eyebrow">A world of different play styles</div><h2>What is a gaming category?</h2>' +
      "<p>A gaming category, also called a genre, groups video games by their gameplay, goals, or style. Some games combine multiple genres, so a game can fit into more than one category.</p></div>" +
      '<a class="btn secondary" href="#categories">Back to categories ↑</a></section>' +
    "</div></main>";

  var search = document.getElementById("search");
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var buttons = [].slice.call(document.querySelectorAll(".filter"));

  function apply() {
    var q = state.q.toLowerCase().trim();
    var shown = 0;
    [].forEach.call(grid.children, function (card) {
      var ok = card.getAttribute("data-hay").indexOf(q) !== -1 && (state.f === "All" || card.getAttribute("data-group") === state.f);
      card.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown > 0;
  }
  search.addEventListener("input", function () { state.q = search.value; apply(); });
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      state.f = b.getAttribute("data-filter");
      buttons.forEach(function (x) { x.classList.toggle("active", x === b); });
      apply();
    });
  });
  apply();
}

function renderGenre(g) {
  document.title = g.name + " Games | GameVerse";
  var chips = GENRES.map(function (x) {
    return '<a class="chip" href="#' + x.id + '"' + (x.id === g.id ? ' aria-current="page"' : "") + ">" + esc(x.name) + "</a>";
  }).join("");
  var rows = g.games.map(function (m, i) {
    return '<a class="game" href="' + esc(m[3]) + '" target="_blank" rel="noopener noreferrer" style="--i:' + i + '">' +
      "<div><h3>" + esc(m[0]) + '</h3><div class="meta">' + esc(m[1]) + "</div><p>" + esc(m[2]) + "</p></div>" +
      '<span class="btn primary">Official site ↗</span></a>';
  }).join("");
  view.innerHTML =
    '<main class="band"><div class="inner">' +
      '<div class="crumb"><a href="#categories">All categories</a> / ' + esc(g.name) + "</div>" +
      '<section class="ghero"><div class="big" aria-hidden="true">' + g.emoji + '</div><div><div class="eyebrow">' + esc(g.group) + " category</div><h1>" + esc(g.name) + "</h1><p>" + esc(g.blurb) + "</p></div></section>" +
      '<nav class="chips" aria-label="Switch category">' + chips + "</nav>" +
      '<section class="games" aria-label="' + esc(g.name) + ' games">' + rows + "</section>" +
      '<p class="note">Each game opens its official page in a new tab. Publishers sometimes move or rename these pages.</p>' +
    "</div></main>";
}

function route() {
  var id = (location.hash || "").replace("#", "");
  var g = GENRES.filter(function (x) { return x.id === id; })[0];
  var anchor = (id === "categories" || id === "about") ? id : "";
  var target = g ? g.id : "home";

  if (target === "home" && current === "home") {
    var el = anchor ? document.getElementById(anchor) : null;
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else { window.scrollTo({ top: 0, behavior: "smooth" }); }
    return;
  }
  var swap = function () {
    if (g) { renderGenre(g); } else { renderHome(); }
    current = target;
    var a = anchor ? document.getElementById(anchor) : null;
    if (a) { a.scrollIntoView({ behavior: "instant", block: "start" }); }
    else { window.scrollTo({ top: 0, behavior: "instant" }); }
  };
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (document.startViewTransition && !calm && current) {
    document.startViewTransition(swap);
  } else {
    swap();
  }
}
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
